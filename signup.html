<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aegis Facility Care | Client Portal Signup</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { charcoal: { DEFAULT: '#1f2937', dark: '#111827' }, ivory: '#fdfbf7', amber: { 600: '#d97706', 700: '#b45309' } }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
  </script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/script.js" defer></script>
</head>
<body class="antialiased bg-ivory dark:bg-charcoal-dark min-h-screen flex flex-col items-center justify-center p-4 pt-20 transition-colors relative">
  
  <div class="absolute top-4 right-4 flex items-center gap-2">
    <button class="theme-toggle w-10 h-10 flex items-center justify-center text-gray-500 hover:text-amber-600 dark:text-gray-400 dark:hover:text-amber-400 transition-colors rounded-full hover:bg-gray-100 dark:hover:bg-gray-800" aria-label="Toggle Theme">
      <i class="ph ph-moon text-xl dark:hidden"></i>
      <i class="ph ph-sun text-xl hidden dark:block"></i>
    </button>
    <button class="rtl-toggle w-10 h-10 flex items-center justify-center text-gray-500 hover:text-amber-600 dark:text-gray-400 dark:hover:text-amber-400 transition-colors text-sm font-bold rounded-full hover:bg-gray-100 dark:hover:bg-gray-800" aria-label="Toggle RTL">
      RTL
    </button>
  </div>

  <div class="w-full max-w-lg premium-card p-8">
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-2 mb-6 group">
        <div class="w-10 h-10 rounded bg-amber-600 flex items-center justify-center text-white font-bold text-xl transition-colors"><i class="ph-fill ph-buildings"></i></div>
        <span class="font-bold text-xl tracking-tight text-charcoal-dark dark:text-white group-hover:text-amber-700 dark:group-hover:text-amber-500 transition-colors">
          Aegis<span class="font-light">Care</span>
        </span>
      </a>
      <h1 class="text-2xl font-bold dark:text-white">Create Account</h1>
      <p class="text-sm text-gray-500 mt-2">Request access to the AegisCare Client Portal</p>
    </div>

    <form id="signupForm" class="space-y-4">
      <div class="form-group">
        <label class="form-label text-sm">Full Name</label>
        <input type="text" name="name" required class="form-input">
        <span class="form-error">Required.</span>
      </div>
      <div class="form-group">
        <label class="form-label text-sm">Company Name</label>
        <input type="text" name="company" required class="form-input">
        <span class="form-error">Required.</span>
      </div>
      <div class="form-group">
        <label class="form-label text-sm">Business Email</label>
        <input type="email" name="email" required class="form-input">
        <span class="form-error">Valid email required.</span>
      </div>
      <div class="form-group">
        <label class="form-label text-sm">Phone</label>
        <input type="tel" name="phone" required class="form-input">
        <span class="form-error">Required.</span>
      </div>
      <div class="form-group">
        <label class="form-label text-sm">Password</label>
        <div class="relative">
          <input type="password" name="password" required class="form-input pr-10">
          <button type="button" onclick="togglePassword(this)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-amber-600">
            <i class="ph ph-eye text-lg"></i>
          </button>
        </div>
        <span class="form-error">Required.</span>
      </div>
      <div class="form-group">
        <label class="form-label text-sm">Confirm Password</label>
        <div class="relative">
          <input type="password" name="confirmPassword" required class="form-input pr-10">
          <button type="button" onclick="togglePassword(this)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-amber-600">
            <i class="ph ph-eye text-lg"></i>
          </button>
        </div>
        <span class="form-error">Passwords do not match.</span>
      </div>
      <div class="form-group">
        <div class="flex items-start">
          <input type="checkbox" name="terms" required class="mt-1 mr-2 rounded text-amber-600 focus:ring-amber-500">
          <label class="text-sm text-gray-600 dark:text-gray-400">
            I agree to the <a href="#" class="text-amber-600 hover:underline">Terms of Service</a> and <a href="#" class="text-amber-600 hover:underline">Privacy Policy</a>
          </label>
        </div>
        <span class="form-error block mt-1">You must accept the terms.</span>
      </div>
      
      <button type="submit" class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded transition-colors mt-2 shadow-sm">
        Create Account
      </button>

      <!-- Divider -->
      <div class="relative flex items-center justify-center my-6">
        <div class="border-t border-gray-200 dark:border-gray-700 w-full"></div>
        <span class="bg-white dark:bg-charcoal px-3 text-xs uppercase tracking-wider text-gray-500 dark:text-gray-400 font-semibold absolute">Or sign up with</span>
      </div>

      <!-- Social Sign Up Options -->
      <div class="grid grid-cols-2 gap-3 pt-1">
        <!-- Google Sign Up -->
        <button type="button" onclick="window.location.href='dashboard.html'" class="flex items-center justify-center gap-2.5 py-2.5 px-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-charcoal text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 hover:border-gray-300 dark:hover:border-gray-600 transition-all text-sm font-semibold shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20">
          <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Google</span>
        </button>

        <!-- Apple Sign Up -->
        <button type="button" onclick="window.location.href='dashboard.html'" class="flex items-center justify-center gap-2.5 py-2.5 px-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-charcoal text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 hover:border-gray-300 dark:hover:border-gray-600 transition-all text-sm font-semibold shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20">
          <svg class="w-5 h-5 flex-shrink-0 fill-current text-black dark:text-white" viewBox="0 0 24 24">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.75 1.04-1.8 0.92-2.85-.92.04-2.01.62-2.65 1.37-.56.65-1.05 1.71-.92 2.74 1.03.08 2.05-.53 2.65-1.26z"/>
          </svg>
          <span>Apple</span>
        </button>
      </div>
    </form>

    <div class="mt-8 text-center text-sm text-gray-600 dark:text-gray-400 border-t border-gray-100 dark:border-gray-700 pt-6 whitespace-nowrap">
      Already have an account? <a href="login.html" class="text-amber-600 font-bold hover:underline">Login</a>
    </div>
  </div>
  
  <script>
    function togglePassword(btn) {
      const input = btn.previousElementSibling;
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('ph-eye');
        icon.classList.add('ph-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('ph-eye-slash');
        icon.classList.add('ph-eye');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      validateForm(document.getElementById('signupForm'), () => {
        window.location.href = 'dashboard.html';
      });
    });
  </script>
</body>
</html>
